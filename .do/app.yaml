name: devdesk-console
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/devdesk-console
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm install && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    envs:
      - key: MODEL_ACCESS_KEY
        value: "REPLACE_WITH_YOUR_DO_MODEL_ACCESS_KEY"
        type: SECRET
      - key: CHEAP_MODEL
        value: "deepseek-v4-flash-0731"
      - key: STRONG_MODEL
        value: "llama-4-maverick"
